version: 2

seeds:
  - name: experiment_metadata
    description: "Mapping of template hashes to experiment names and metadata"
    columns:
      - name: experiment_date
        description: "Date the experiment was run"
        data_type: date
        tests:
          - not_null
      
      - name: experiment_name
        description: "Human-readable experiment identifier"
        tests:
          - not_null
          - unique
      
      - name: agent_role
        description: "Agent role (JUDGE, SYNTHESISER, SCORERS)"
        tests:
          - not_null
          - accepted_values:
              values: ['JUDGE', 'SYNTHESISER', 'SCORERS']
      
      - name: template_hash
        description: "Template hash from the system"
        tests:
          - not_null
          - unique
      
      - name: problem
        description: "Problem the experiment was addressing"
      
      - name: change_link
        description: "GitHub commit or PR link"
      
      - name: description
        description: "Detailed description of changes"
      
      - name: success_metric
        description: "How success was measured"