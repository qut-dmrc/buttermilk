version: 2

models:
  - name: int_predictions
    description: "Judge and synthesizer predictions with metadata"
    columns:
      - name: call_id
        description: "Unique identifier for prediction"
        tests:
          - unique
          - not_null
      
      - name: record_id
        description: "Content being evaluated"
        tests:
          - not_null
      
      - name: judge_role
        description: "JUDGE or SYNTHESISER"
        tests:
          - accepted_values:
              values: ['JUDGE', 'SYNTHESISER']
      
      - name: predicted_violating
        description: "Prediction outcome"
        tests:
          - not_null
      
      - name: expected_violating
        description: "Ground truth outcome"
        tests:
          - not_null

  - name: int_scores_aggregated
    description: "SCORER evaluations of predictions"
    columns:
      - name: scorer_call_id
        description: "Unique identifier for scorer evaluation"
        tests:
          - unique
          - not_null
      
      - name: parent_call_id
        description: "Links to the prediction being scored"
        tests:
          - not_null
          - relationships:
              to: ref('int_predictions')
              field: call_id
      
      - name: correctness
        description: "Overall correctness score from SCORER"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true

  - name: int_experiment_completeness
    description: "Tracks completeness of experimental runs"
    columns:
      - name: template_hash
        description: "Template identifier"
        tests:
          - not_null
      
      - name: record_hash
        description: "Content identifier"
        tests:
          - not_null
      
      - name: completeness_status
        description: "Status of experimental completeness"
        tests:
          - not_null
          - accepted_values:
              values: ['MISSING', 'INSUFFICIENT', 'COMPLETE']
      
      - name: actual_predictions
        description: "Number of actual predictions made"
        tests:
          - not_null
      
      - name: session_count
        description: "Number of sessions for this combination"
        tests:
          - not_null