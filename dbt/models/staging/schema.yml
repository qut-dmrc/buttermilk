version: 2

models:
  - name: stg_flows
    description: "Cleaned and structured agent trace data from raw flow table"
    columns:
      - name: session_id
        description: "Unique identifier for the experimental session"
        tests:
          - not_null
      
      - name: call_id
        description: "Unique identifier for individual agent calls"
        tests:
          - unique
          - not_null
      
      - name: timestamp
        description: "When the agent call was executed"
        tests:
          - not_null
      
      - name: parent_call_id
        description: "Links SCORER calls to their JUDGE/SYNTH predictions"
      
      - name: record_id
        description: "Identifier for the content being evaluated"
        tests:
          - not_null
      
      - name: agent_name
        description: "Name of the agent making the prediction/evaluation"
        tests:
          - not_null
      
      - name: agent_model
        description: "LLM model used by the agent"
        tests:
          - accepted_values:
              values: ['gpt-4', 'claude-3-sonnet', 'gemini-pro', 'claude-3-haiku', 'gpt-4o']
              quote: false
      
      - name: agent_role
        description: "Role of the agent in the evaluation pipeline"
        tests:
          - not_null
          - accepted_values:
              values: ['JUDGE', 'SYNTHESISER', 'SCORERS', 'FETCH']
              quote: false
      
      - name: judge_criteria
        description: "Evaluation criteria used (TJA, GLAAD, Australian, Simplified)"
        tests:
          - accepted_values:
              values: ['TJA', 'GLAAD', 'Australian', 'Simplified']
              quote: false
      
      - name: template_name
        description: "Name of the prompt template used"
      
      - name: template_hash
        description: "Hash of the template for A/B testing"
        tests:
          - not_null
      
      - name: predicted_violating
        description: "Agent's prediction: does content violate guidelines?"
      
      - name: expected_violating
        description: "Ground truth: does content actually violate guidelines?"
      
      - name: correctness
        description: "SCORER assessment of prediction quality (0-1)"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
      
      - name: confidence
        description: "Agent's confidence in their prediction"
      
      - name: full_reasons
        description: "Complete reasoning provided by the agent"
      
      - name: error
        description: "Any errors encountered during execution"