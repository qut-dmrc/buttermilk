version: 2

semantic_models:
  - name: judge_scores_semantic
    model: ref('judge_scores') 
    description: "Semantic model for judge scoring analysis in TJA template evaluation"
    
    defaults:
      agg_time_dimension: timestamp
    
    entities:
      - name: prediction
        type: primary
        expr: call_id
        description: "Unique identifier for each prediction"
      
      - name: session
        type: foreign  
        expr: session_id
        description: "Experimental session grouping multiple predictions"
      
      - name: record
        type: foreign
        expr: record_id
        description: "Content record being evaluated"
      
      - name: template
        type: foreign
        expr: judge_hash
        description: "Template variant used for A/B testing"

    dimensions:
      - name: timestamp
        type: time
        type_params:
          time_granularity: hour
        description: "When the prediction was made"
      
      - name: judge_model
        type: categorical
        description: "Language model used for prediction (GPT-4, Claude, etc.)"
      
      - name: judge_criteria  
        type: categorical
        description: "Evaluation criteria applied (TJA, GLAAD, Australian, Simplified)"
      
      - name: judge_template
        type: categorical
        description: "Template name used for prompting"
      
      - name: judge_role
        type: categorical
        description: "Agent role in pipeline (JUDGE, SYNTHESISER)"
      
      - name: score_quality
        type: categorical
        description: "Quality of the score (valid, duplicate_resolved, missing_score)"
      
      - name: scorer_model
        type: categorical
        description: "Model used for scoring the prediction"
      
      - name: predicted_violating
        type: categorical
        description: "Agent's prediction outcome"
      
      - name: expected_violating
        type: categorical
        description: "Ground truth outcome"

    measures:
      - name: prediction_count
        agg: count
        expr: call_id
        description: "Total number of predictions"
      
      - name: correct_predictions
        agg: sum
        expr: CAST(correct AS INT64)
        description: "Number of correct predictions"
      
      - name: total_correctness_score
        agg: sum
        expr: correctness
        description: "Sum of correctness scores from SCORER agents"
        agg_time_dimension: timestamp
      
      - name: valid_scores
        agg: sum
        expr: CASE WHEN score_quality = 'valid' THEN 1 ELSE 0 END
        description: "Count of predictions with valid scores"
      
      - name: duplicate_resolved_scores
        agg: sum  
        expr: CASE WHEN score_quality = 'duplicate_resolved' THEN 1 ELSE 0 END
        description: "Count of predictions with duplicate-resolved scores"
      
      - name: missing_scores
        agg: sum
        expr: CASE WHEN score_quality = 'missing_score' THEN 1 ELSE 0 END
        description: "Count of predictions with missing scores"
      
      - name: sessions_count
        agg: count_distinct
        expr: session_id
        description: "Number of unique experimental sessions"
      
      - name: records_evaluated
        agg: count_distinct
        expr: record_id
        description: "Number of unique content records evaluated"