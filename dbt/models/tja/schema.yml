version: 2

models:
  - name: judge_scores
    description: "This model joins predictions from JUDGE and SYNTHESISER agents with their corresponding scores from SCORER agents. It serves as the primary analysis table for evaluating model performance against a golden set."
    columns:
      - name: call_id
        description: "The unique ID for the prediction call (from a JUDGE or SYNTHESISER). This is the primary key."
        data_tests:
          - unique
          - not_null

      - name: scorer_call_id
        description: "The unique ID for the scoring call."

      - name: session_id
        description: "The session ID for the entire flow run."
        data_tests:
          - not_null

      - name: record_id
        description: "The ID of the golden set record being evaluated."

      - name: judge
        description: "The name of the agent making the prediction."

      - name: judge_model
        description: "The LLM used by the judge agent."

      - name: scorer
        description: "The name of the agent providing the score."

      - name: scorer_model
        description: "The LLM used by the scorer agent."

      - name: predicted_violating
        description: "The boolean prediction made by the judge agent."

      - name: expected_violating
        description: "The ground truth label from the golden set."

      - name: correct
        description: "A boolean flag indicating if the prediction matched the ground truth."

      - name: correctness
        description: "A numeric score (0-1) provided by the scorer agent."
