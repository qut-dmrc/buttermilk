# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "buttermilk"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "bm"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Project variables for configuration
vars:
  # Data quality thresholds
  cutoff_date: "2025-05-01"
  min_stochastic_runs: 10
  min_coverage_threshold: 0.8
  
  # Experiment configuration
  exclude_test_hashes: []
  
# Model configuration
models:
  buttermilk:
    # Staging models - always table for performance
    staging:
      +materialized: table
      +docs:
        node_color: "#228B22"
    
    # Intermediate models - views for flexibility  
    intermediate:
      +materialized: view
      +docs:
        node_color: "#FFA500"
    
    # Marts - tables for analysis performance
    marts:
      +materialized: table
      +docs:
        node_color: "#4169E1"

# Test configuration
tests:
  buttermilk:
    +severity: warn  # Don't fail builds on data quality issues
    
# Documentation
docs-paths: ["docs"]

