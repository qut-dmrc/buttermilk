# Enhanced Zotero vectorization configuration
# Usage: python -m buttermilk.data.vector +run=vectorise_zotero

# @package _global_

defaults:
  - _self_
  - /storage: zot  # Use zot.yaml for ChromaDB configuration

# Optional: start from a specific offset (for resuming)
# start_from: 0

name: zotero_vectorizer
job: zotero

# ChromaDB vector store configuration (inherits from storage/zot.yaml)
vectoriser:
  _target_: buttermilk.data.vector.ChromaDBEmbeddings
  persist_directory: ${storage.persist_directory}
  collection_name: ${storage.collection_name}
  embedding_model: ${storage.embedding_model}
  dimensionality: ${storage.dimensionality}
  arrow_save_dir: ${oc.env:HOME}/.cache/buttermilk/zotero/embeddings
  concurrency: 20
  sync_batch_size: 50
  sync_interval_minutes: 10
  deduplication_strategy: both
  # Multi-field configuration for Zotero data
  multi_field_config:
    content_field: text_content
    chunk_size: 4000
    chunk_overlap: 1000
    additional_fields:
      - source_field: abstract
        chunk_type: abstract
        min_length: 100
      - source_field: annotations
        chunk_type: annotation
        min_length: 50
      - source_field: tags
        chunk_type: tags
        min_length: 20

# Text chunking configuration
chunker:
  _target_: buttermilk.data.vector.DefaultTextSplitter
  chunk_size: 4000
  chunk_overlap: 1000

# Zotero data source
input_docs:
  _target_: buttermilk.libs.zotero.ZotDownloader
  library: ${oc.env:ZOTERO_LIBRARY_ID}
  save_dir: ${oc.env:HOME}/.cache/buttermilk/zotero/pdfs

# PDF text extraction
preprocessor:
  _target_: buttermilk.tools.pdf_extractor.PdfTextExtractor
  save_dir: ${..input_docs.save_dir}

# Optional: Add citation extraction or other processing
processor:
  _target_: buttermilk.tools.citator.Citator
  model: gemini-1.5-flash-latest  # Faster model for processing