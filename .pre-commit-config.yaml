# Pre-commit hooks for buttermilk
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # Security: Detect secrets and credentials
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(tests/.*|\.secrets\.baseline)$
  # Security: Additional secret scanning
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: Check for large files
        args: ['--maxkb=1000']
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe'] # Allow custom YAML tags used by Hydra
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: end-of-file-fixer
        name: Fix end of files
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: mixed-line-ending
        name: Fix mixed line endings
  # YAML formatting
  - repo: https://github.com/google/yamlfmt
    rev: v0.14.0
    hooks:
      - id: yamlfmt
        name: yamlfmt YAML formatter
        files: '\.(yaml|yml)$'
        exclude: '^\.secrets\.baseline$'
  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 0.7.21
    hooks:
      - id: mdformat
        name: mdformat Markdown formatter
        additional_dependencies:
          - mdformat-gfm # GitHub Flavored Markdown
          - mdformat-frontmatter # YAML frontmatter
          - mdformat-footnote # Footnote support
        args: [--wrap, "no"] # Don't wrap long lines
  # JSON5 checking (looser, allows comments)
  - repo: https://github.com/maresb/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5
        name: Check JSON5 syntax (allows comments)
        files: '(\.(json|json5|jsonc|jsonl)$)'
  # JSON Schema validation
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.30.0
    hooks:
      - id: check-jsonschema
        name: Validate JSON schemas
        files: '^buttermilk/schemas/.*\.json$'
        args: ['--schemafile', 'https://json-schema.org/draft-07/schema']
      - id: check-github-workflows
        name: Validate GitHub Actions workflows
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: check-dependabot
        name: Validate Dependabot config
        files: '^\.github/dependabot\.ya?ml$'
  # Python code quality - Ruff (replaces black, isort, flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.5
    hooks:
      - id: ruff
        name: Ruff linter
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff formatter
  # Repository cleanliness: Prevent tracking documentation
  - repo: local
    hooks:
      - id: prevent-tracking-docs
        name: Prevent repository issue tracking files
        entry: Repository issue tracking files are forbidden - use GitHub issues instead
        language: fail
        files: '^.*_(README|NOTES|STATUS|TRACKING|TODO|BUGS|FIXES)\.md$'
      - id: prevent-standalone-validation
        name: Prevent standalone validation scripts
        entry: Standalone validation scripts forbidden - use tests/ directory with pytest
        language: fail
        files: '^(?!tests/).*/(test_|verify_|check_|validate_|demo_|example_).*\.py$'
      - id: prevent-root-test-files
        name: Prevent test files outside tests/ directory
        entry: Test files must be in tests/ directory only
        language: fail
        files: '^(?!tests/).*test.*\.py$'
        exclude: '^(tests/|.*conftest\.py$)'
      - id: check-api-keys
        name: Check for common API key patterns
        # Pattern for API keys (customize based on your services)
        entry: '(sk_live_|pk_live_|tl_|api[_-]?key["\s]*[:=]["\s]*[A-Za-z0-9]{20,}|secret["\s]*[:=]["\s]*[A-Za-z0-9]{20,}|token["\s]*[:=]["\s]*[A-Za-z0-9]{20,})'
        language: pygrep
        args: ['--multiline']
        files: '\.(py|yaml|yml|json|env|sh|md)$'
        exclude: '^(\.pre-commit-config\.yaml|tests/.*|docs/.*|bots/.*|\.secrets\.baseline)$'
        types: [text]
  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        name: mypy type checking
        additional_dependencies:
          - pydantic>=2.8.2
        args: [--no-strict-optional, --ignore-missing-imports, --follow-imports=skip]
        exclude: ^(tests/|examples/)
  # Pytest checks
  - repo: local
    hooks:
      - id: pytest-check
        name: Run fast tests
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: false # Only run if explicitly enabled
        stages: [manual] # Requires --hook-stage manual
        args:
          - tests/
          - -m
          - not slow and not endtoend
          - --maxfail=3
          - -x # Stop on first failure
# Configuration
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false # Continue checking all hooks even if one fails
minimum_pre_commit_version: '2.20.0'
