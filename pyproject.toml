[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["buttermilk"]

[tool.mypy]
python_version = "3.11"  # Specify your target Python version
strict = false
annotations = true      # delayed typing annotations
warn_unused_configs = true # Warn about unused mypy settings
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.uv]
upgrade = true
default-groups = [] # Add the groups you want installed by default
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
buttermilk = { workspace = true }

[tool.black]
line-length = 150

[tool.ruff]
line-length = 150
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I", "PL"]
ignore = [
    "RET504",  # Unnecessary variable assignment before return
    "RET503",  # Multiple returns 
    "E501",    # Line too long 
    "TRY003", 
    "D401",     # First line of docstring must be in imperative mood
    "EM101",   # No f-strings or string literals in exceptions
    "RET505",  # Unnecessary else after return
    "PLR0904",  # Too many public methods
    "PLR0915",  # Too many public methods
    "W293",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["buttermilk"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[project.scripts]
bm-chat = "buttermilk.runner.cli:main"
bm-test-agent = "buttermilk.runner.agent_tester:main"
buttermilk-assess-journalism = "buttermilk.scripts.run_trans_flow:run"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests, don't run by default",
  "scheduled: mark tests to run in scheduled testing",
]

norecursedirs = ["docs", "*.egg-info", "*.egg", "bin", "demo", ".git", "appdir", ".tox", "mediamarkets", "scrapers"]
timeout = 600
#default_async_timeout = 300
addopts = [ 
    "--capture=fd", 
    "--continue-on-collection-errors",
    "--durations=10", 
    "-n 24", 
    "-v", # show name of tests 
    "-rfEX", # show extra summary info, including for failed, eXpected failures, and Errors
    "-s",
    "--tb=auto",
    # "--show-capture=no",
    # "--disable-warnings",
    "-m not integration",
]

#  "--timeout_method=thread", 
# "--with-integration"
# 

filterwarnings = [
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:Passing field metadata as keyword arguments is deprecated",
    "ignore:.*grpc_wait_for_shutdown_with_timeout.*:Warning",
]
