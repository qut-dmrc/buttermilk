[project]
requires-python = ">=3.10"
authors = [
  { name = "Nicolas Suzor", email = "nic@suzor.com" },
]
name = "buttermilk"
dynamic = ["version"]
description = "Modular AI research framework for HASS scholars — culture-first, traceable, reproducible"
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
  "research",
  "humanities",
  "hass",
  "ai",
  "llm",
  "agents",
  "asyncio",
  "scholarops",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]
dependencies = [
  # Core framework - configuration, logging, types
  "pydantic>=2.8.2,<3.0.0",
  "hydra-core>=1.3.2,<2.0.0",
  "structlog>=24.1.0",
  "pyyaml>=6.0.2,<7.0.0",
  "python-dotenv>=1.1.1",
  # Essential utilities
  "shortuuid>=1.0.13,<2.0.0",
  "psutil>=5.9.5,<6.0.0",
  "httpx>=0.27.2,<2.0.0",
  "requests>=2.32.3,<3.0.0",
  "rich>=13.9.4,<14.0.0",
  "anyio>=4.7.0,<5.0.0",
  # LLM core (always needed for AI features)
  "litellm>=1.0.0",
  "anthropic[vertex]>=0.42.0,<1.0.0",
  # Basic data structures
  "numpy>=1.26.4,<3.0.0",
  "pandas>=2.3.0",
  # JSON/data handling
  "json-repair>=0.28.3,<1.0.0",
  "jsonschema>=4.0.0,<5.0.0",
  "marshmallow>=3.23.2,<4.0.0",
  # File paths
  "cloudpathlib>=0.20.0,<1.0.0",
  # Utilities
  "regex>=2024.9.11,<2026.0.0",
  "unidecode>=1.3.8,<2.0.0",
  "validators>=0.33.0,<1.0.0",
  "keyring>=23.4.0,<26.0.0",
  # GCP cloud support
  "google-cloud-storage>=3.0.0,<3.6.0",
  "google-cloud-bigquery>=3.27.0,<4.0.0",
  "google-cloud-bigquery-storage>=2.27.0,<3.0.0",
  "google-cloud-secret-manager>=2.22.0,<3.0.0",
  "google-cloud-aiplatform>=1.85.0,<2.0.0",
  "google-cloud-logging>=3.11.2,<4.0.0",
  "google-cloud-language>=2.15.1,<3.0.0",
  "google-cloud-pubsub>=2.27.1,<3.0.0",
  "google-generativeai>=0.7.2,<1.0.0",
  "google-genai[aiohttp]>=1.25.0",
  "google-crc32c>=1.6.0,<2.0.0",
  "proto-plus>=1.25.0,<2.0.0",
  "db-dtypes>=1.3.1,<2.0.0",
  "gspread>=6.1.2,<7.0.0",
  "coloredlogs>=15.0.1,<16.0.0", # For GCP logging
  # Vector database and RAG
  "chromadb>=0.5.0,<2.0.0",
  "langchain>=0.3.21,<1.0.0",
  "langchain-text-splitters>=0.3.7",
  "semchunk>=3.2.2",
  "huggingface-hub>=0.26.1,<1.0.0",
  "sentencepiece>=0.2.0,<1.0.0",
  # Web scraping and content extraction
  "beautifulsoup4>=4.12.3,<5.0.0",
  "readabilipy>=0.3.0",
  "newspaper4k>=0.9.3.1",
  "lxml[html-clean]>=5.3.0",
  "fake-useragent>=2.0.3",
  "bleach>=6.2.0,<7.0.0",
  "urllib3>=2.2.2,<3.0.0",
  "pillow>=10.0.0",
  "pdfminer-six>=20240706",
  "json5>=0.10.0",
  "jq>=1.8.0,<2.0.0",
  "gql<4.0.0",
  # Tracing and observability
  # weave removed for performance optimization
  "traceloop-sdk>=0.38.5",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-instrumentation>=0.50b0",
  "opentelemetry-instrumentation-openai>=0.33.0",
  "opentelemetry-instrumentation-logging>=0.56",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  "opentelemetry-exporter-gcp-trace>=1.9.0",
  "opentelemetry-exporter-gcp-monitoring>=1.8.0",
  "opentelemetry-exporter-gcp-logging>=1.8.0",
  "opentelemetry-semantic-conventions>=0.56",
  "opentelemetry-resourcedetector-gcp>=1.8",
  "sentry-sdk>=2.24.0",
  "jmespath>=1.0.1",
  # NOTE: pdftotext is invoked as a system binary via subprocess (see processors/bash.py).
  # The PyPI package "poppler-utils" is *not* a Python wrapper around poppler; it ships
  # GPL-2-only metadata and was never imported. Install poppler-utils via your system
  # package manager: apt-get install poppler-utils / brew install poppler / dnf install poppler-utils.
  "aioconsole>=0.8.2",
  "langdetect>=1.0.9",
  "replicate>=0.34.2",
  "matplotlib>=3.10.8",
]

[project.optional-dependencies]
# ML/Training (heavy dependencies)
ml = [
  # AWS cloud support
  "boto3>=1.35.7,<2.0.0",
  # Azure cloud support
  "azureml-core>=1.57.0,<2.0.0",
  "azure-identity>=1.17.1,<2.0.0",
  "azure-keyvault>=4.2.0,<5.0.0",
  "azure-ai-contentsafety>=1.0.0,<2.0.0",
  "azure-cognitiveservices-vision-contentmoderator>=1.0.0,<2.0.0",
  "azure-ai-inference>=1.0.0b9",
  "azure-ai-ml==1.18.0",
  "azure-monitor-opentelemetry-exporter==1.0.0b41",
  "replicate>=0.32.1,<1.0.0",
  "torch>=2.5.1,<3.0.0",
  "scipy>=1.15.3",
  "transformers>=4.44.2,<5.0.0",
  "evaluate>=0.4.2,<1.0.0",
  "peft>=0.12.0,<1.0.0",
  "einops>=0.8.0,<1.0.0",
  "hf-transfer>=0.1.8,<1.0.0",
  "loky>=3.4.1,<4.0.0",
]

# Development tools
dev = [
  # Development tools
  "pytest>=8.3.2",
  "pytest-mock>=3.14.0,<4.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "pytest-timeout>=2.3.1,<3.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-anyio>=0.0.0",
  "pytest-benchmark>=5.1.0",
  "ruff>=0.12.8",
  "dill>=0.4.0",
  "uv>=0.8.4",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "radon>=6.0.1",
  # Research/academic tools
  "fastapi>=0.100.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "flask-restx>=1.3.0",
  "slack-bolt>=1.21.2,<2.0.0",
  "aioconsole>=0.8.1",
  "pyzotero>=1.6.11",
  "themoviedb>=1.0.2",
  # Data tools
  "fsspec>=2024.6.1",
  "gcsfs>=2024.6.1",
  "pandas-stubs>=2.2.3.241126",
  "openpyxl>=3.1.5,<4.0.0",
  # Visualization
  "matplotlib>=3.9.2,<4.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "plotly>=5.24.1,<6.0.0",
  "altair>=5.0.0",
  "tqdm>=4.66.5,<5.0.0",
  "cmap>=0.3.0,<1.0.0",
  # Notebook support
  "jupyter>=1.1.1",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
  # Extras
  "hydra-colorlog>=1.2.0,<2.0.0",
  "gradio>=5.4.0,<6.0.0",
  "opencv-python>=4.10.0.84,<5.0.0.0",
  "scikit-learn>=1.5.1,<2.0.0",
  "bump-my-version>=1.2.2",
]


[project.urls]
Homepage = "https://github.com/qut-dmrc/buttermilk"
Repository = "https://github.com/qut-dmrc/buttermilk"
Issues = "https://github.com/qut-dmrc/buttermilk/issues"
Documentation = "https://github.com/qut-dmrc/buttermilk#readme"
Changelog = "https://github.com/qut-dmrc/buttermilk/blob/stable/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.6.2"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["buttermilk*", "examples*", "hydra_plugins*"]
exclude = ["tests*", "*.tests*", "*.tests"]
namespaces = true

[tool.setuptools.package-data]
buttermilk = [
  "py.typed",
  "conf/**/*.yaml",
  "conf/**/*.yml",
  "templates/**/*.jinja2",
  "templates/**/*.json",
  "templates/**/*.txt",
  "templates/**/*.md",
  "schemas/**/*.json",
  "schemas/**/*.sql",
  "toxicity/**/*.yaml",
  "toxicity/**/*.txt",
  "toxicity/**/*.jinja2",
  "_core/assets/*",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.uv]
upgrade = true
default-groups = [] # Add the groups you want installed by default
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
buttermilk = { workspace = true }

[tool.black]
line-length = 150

[project.scripts]
bm = "buttermilk.cli.main:main"
bm-debug = "buttermilk.debug.cli:debug"

[project.entry-points."hydra_plugins"]
buttermilk_search_path_plugin = "hydra_plugins.buttermilk_search_path_plugin:ButtermilkSearchPathPlugin"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests (slower, mocked and faked at the edges)",
  "demo: slow, expensive tests with external dependencies and full human verification",
  "scheduled: mark tests to run in scheduled testing",
  "slow: mark tests as slow (deselect with '-m \"not slow\"')",
  "endtoend: end-to-end tests requiring full environment (real APIs, real storage)",
]
testpaths = [
  "tests",
  "examples",
]

norecursedirs = ["docs", "*.egg-info", "*.egg", "bin", "demo", ".git", "appdir", ".tox", "mediamarkets", "scrapers"]
timeout = 90
# Note: Using pytest-anyio, not pytest-asyncio.
# Session-scoped event loop is achieved via session_runner fixture in conftest.py.
addopts = [
  "--continue-on-collection-errors",
  "--durations=10",
  "-n 20",
  "-q", # quiet - reduces output noise for TUI compatibility
  "-rfEX", # show extra summary info for failed/errors only
  "--tb=short",
  "-m",
  "not demo and not slow and not integration",
]

filterwarnings = [
  "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:Passing field metadata as keyword arguments is deprecated",
  "ignore:.*grpc_wait_for_shutdown_with_timeout.*:Warning",
  "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
]


[tool.ruff]
target-version = "py310"
line-length = 150 # Match buttermilk's style
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "W", # pycodestyle warnings
  "C90", # mccabe complexity
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "C4", # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  "EM", # flake8-errmsg
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "PIE", # flake8-pie
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  "PL", # Pylint
  "RUF", # Ruff-specific rules
]

ignore = [
  "E501",    # Line too long (handled by formatter)
  "PLR0913", # Too many arguments
  "PLR2004", # Magic value comparison
  # TODO: Pre-existing violations introduced when strict lint rules were added in
  # 35b91272 without fixing the existing codebase. Re-enable incrementally as
  # violations are fixed in a dedicated cleanup PR.
  "EM101", "EM102",           # Exception message as string/f-string literal
  "PLC0415",                  # Import not at top of file (lazy imports for circular deps)
  "ARG001", "ARG002", "ARG005", # Unused function/method/lambda arguments
  "PLW0603", "PLW0602",       # Global statement (intentional singleton patterns)
  "PLR0912", "PLR0915", "PLR0911", "PLR1714", # Complexity and style
  "C901",                     # McCabe complexity
  "RET504",                   # Unnecessary pre-return assignment
  "SIM102", "SIM105", "SIM108", "SIM118", # Simplification suggestions
  "B904", "B905", "B006", "B007", # flake8-bugbear style
  "PTH111", "PTH109", "PTH123", # pathlib migration
  "N802", "N806", "N801", "N805", "N811", "N818", # Naming conventions
  "RUF002", "RUF012", "RUF013", "RUF015", "RUF022", "RUF059", # Ruff-specific
  "A002",                     # Argument shadowing a Python builtin
  "UP007",                    # Use X | Y for type annotations (pyupgrade migration)
  "DTZ005",                   # datetime.now() without tz (intentional in places)
  "C401", "C408",             # Comprehension and dict literal style
  "PIE794",                   # Class field defined multiple times
  "TID252",                   # Relative imports from parent modules
  "PLW0108",                  # Lambda may be unnecessary
  "PLW2901",                  # For loop variable overwritten by assignment
  "E402",                     # Module import not at top of file (circular dep avoidance)
  "E722",                     # Do not use bare except
  "SIM115", "SIM201",         # Additional simplification suggestions
  "B008", "B023",             # FastAPI Depends in defaults; loop variable not bound
  "RUF001", "RUF003", "RUF005", "RUF006", "RUF043", # Additional ruff rules
  "F841",                     # Local variable assigned but never used
  "F811",                     # Redefinition of unused import
  "F821",                     # Undefined name (lazy/optional/version-gated imports)
  "F403", "F405",             # Star imports
  "PT006", "PT011", "PT012",  # pytest style rules
  "B006", "B027",             # Mutable default; empty ABC method without abstract decorator
  "N803",                     # Argument name should be lowercase
  "SIM101", "SIM103", "SIM110", "SIM401", "SIM910", # Additional simplification
  "ARG004",                   # Unused static method argument
  "PIE810",                   # Call endswith once with a tuple
  "PTH116", "PTH110", "PTH119", "PTH202", "PTH204", "PTH207", # Additional pathlib
  "DTZ006", "DTZ007",         # Additional timezone rules
  "A004",                     # Import shadowing a builtin
  "C419",                     # Unnecessary list comprehension
  "RET503",                   # Missing explicit return
  "RUF100",                   # Unused noqa directive (from cleanup)
  "A001",                     # Variable shadowing a builtin
  "PLE0303",                  # __len__ does not return non-negative
  "N814", "N816",             # Mixed-case variable/import naming
  "B004", "B017", "B018",     # hasattr(__call__); blind except; useless expression
  "DTZ001", "DTZ004",         # Naive datetime; utcfromtimestamp
  "PLR1704",                  # Redefining argument with local name
  "E721", "E741",             # Type comparison style; ambiguous variable name
  "SIM117",                   # Nested with statements
  "PT003", "PT013", "PT017", "PT018", # Pytest style rules
  "PIE804",                   # Unnecessary dict kwargs
]

[tool.ruff.lint.mccabe]
max-complexity = 15 # Buttermilk is more complex than bot

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG",     # Unused arguments common in fixtures
  "PLR2004", # Magic values OK in tests
]
"buttermilk/agents/__init__.py" = [
  "F401", # Re-exported symbols used by consumers of buttermilk.agents namespace
]
"buttermilk/toxicity/__init__.py" = [
  "F401", # Re-exported symbols used by consumers of buttermilk.toxicity namespace
]


