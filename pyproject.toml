    "replicate>=0.32.1,<1.0.0",
    "torch>=2.5.1,<3.0.0",
    "scipy>=1.15.3",
    "transformers>=4.44.2,<5.0.0",
    "evaluate>=0.4.2,<1.0.0",
    "peft>=0.12.0,<1.0.0",
    "einops>=0.8.0,<1.0.0",
    "hf-transfer>=0.1.8,<1.0.0",
    "loky>=3.4.1,<4.0.0",
]

# Research/academic tools
research = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "flask-restx>=1.3.0",
    "slack-bolt>=1.21.2,<2.0.0",
    "streamlit>=1.45.0",
    "shiny>=1.4.0",
    "aioconsole>=0.8.1",
    "pyzotero>=1.6.11",
    "themoviedb>=1.0.2",
]

# Development tools
dev = [
    "pytest>=8.3.2,<9.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "pytest-timeout>=2.3.1,<3.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.12.8",
    "dill>=0.4.0",
    "uv>=0.8.4",
    # Data tools
    "fsspec>=2024.6.1,<2025.0.0",
    "gcsfs>=2024.6.1,<2025.0.0",
    "pandas-stubs>=2.2.3.241126",
    "openpyxl>=3.1.5,<4.0.0",
    # Visualization
    "matplotlib>=3.9.2,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "plotly>=5.24.1,<6.0.0",
    "altair>=5.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "cmap>=0.3.0,<1.0.0",
    # Notebook support
    "jupyter>=1.1.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    # Extras
    "hydra-colorlog>=1.2.0,<2.0.0",
    "gradio>=5.4.0,<6.0.0",
    "opencv-python>=4.10.0.84,<5.0.0.0",
    "scikit-learn>=1.5.1,<2.0.0",
    # DBT
    "dbt>=1.0.0.40.6",
    "dbt-bigquery>=1.10.2",
    "dbt-core>=1.10.8",
]

# Everything (for backwards compatibility or quick start)
all = [
    "buttermilk[azure,aws,ml,dev,research]"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["buttermilk*", "examples*"]
exclude = ["tests*", "*.tests*", "*.tests"]

[tool.setuptools.package-data]
buttermilk = [
    "conf/**/*.yaml",
    "conf/**/*.yml", 
    "templates/**/*.jinja2",
    "templates/**/*.json",
    "templates/**/*.txt",
    "templates/**/*.md",
    "schemas/**/*.json",
    "schemas/**/*.sql",
    "toxicity/**/*.yaml",
    "toxicity/**/*.txt",
    "toxicity/**/*.jinja2"
]


[tool.mypy]
python_version = "3.11"  # Specify your target Python version
strict = false
annotations = true      # delayed typing annotations
warn_unused_configs = true # Warn about unused mypy settings
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.uv]
upgrade = true
default-groups = [] # Add the groups you want installed by default
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
buttermilk = { workspace = true }

[tool.black]
line-length = 150

[project.scripts]
bm = "buttermilk.runner.batch_cli:main"
bm-chat = "buttermilk.runner.cli:main"
bm-test-agent = "buttermilk.runner.agent_tester:main"
buttermilk-assess-journalism = "buttermilk.scripts.run_trans_flow:run"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests (slower, mocked and faked at the edges)",
  "endtoend: tests that require real API calls with valid credentials",
  "scheduled: mark tests to run in scheduled testing",
  "slow: mark tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = [
    "tests",
    "examples",
]

norecursedirs = ["docs", "*.egg-info", "*.egg", "bin", "demo", ".git", "appdir", ".tox", "mediamarkets", "scrapers"]
timeout = 600
asyncio_default_fixture_loop_scope = "package"
asyncio_debug = true
addopts = [ 
    "--capture=fd", 
    "--continue-on-collection-errors",
    "--durations=10", 
    "-n 20", 
    "-v", # show name of tests 
    "-rfEX", # show extra summary info, including for failed, eXpected failures, and Errors
    "-s",
    "--tb=short",
    "-m", "not endtoend",
]



filterwarnings = [
    "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
    "ignore:Passing field metadata as keyword arguments is deprecated",
    "ignore:.*grpc_wait_for_shutdown_with_timeout.*:Warning"
]

[dependency-groups]
dev = [
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pytest-asyncio>=1.2.0",
]
