  "hydra-core>=1.3.2,<2.0.0",
  "structlog>=24.1.0,<25.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "python-dotenv>=1.1.1",
  # Essential utilities
  "shortuuid>=1.0.13,<2.0.0",
  "psutil>=5.9.5,<6.0.0",
  "httpx>=0.27.2,<1.0.0",
  "requests>=2.32.3,<3.0.0",
  "rich>=13.9.4,<14.0.0",
  "anyio>=4.7.0,<5.0.0",
  # LLM core (always needed for AI features)
  "litellm>=1.0.0",
  "anthropic[vertex]>=0.42.0,<1.0.0",
  # Basic data structures
  "numpy>=1.26.4",
  "pandas>=2.3.0",
  # JSON/data handling
  "json-repair>=0.28.3,<1.0.0",
  "jsonschema>=4.0.0,<5.0.0",
  "marshmallow==3.23.2",
  # File paths
  "cloudpathlib>=0.20.0,<1.0.0",
  "pathlib>=1.0.1,<2.0.0",
  # Utilities
  "regex>=2024.9.11,<2025.0.0",
  "unidecode>=1.3.8,<2.0.0",
  "validators>=0.33.0,<1.0.0",
  "keyring>23.4.0",
  # GCP cloud support
  "google-cloud-storage>=3.0.0,<3.6.0",
  "google-cloud-bigquery>=3.27.0,<4.0.0",
  "google-cloud-bigquery-storage>=2.27.0,<3.0.0",
  "google-cloud-secret-manager>=2.22.0,<3.0.0",
  "google-cloud-aiplatform>=1.85.0,<2.0.0",
  "google-cloud-logging>=3.11.2,<4.0.0",
  "google-cloud-language>=2.15.1,<3.0.0",
  "google-cloud-pubsub>=2.27.1,<3.0.0",
  "google-generativeai>=0.7.2,<1.0.0",
  "google-genai[aiohttp]>=1.25.0",
  "google-crc32c>=1.6.0,<2.0.0",
  "proto-plus>=1.25.0,<2.0.0",
  "db-dtypes>=1.3.1,<2.0.0",
  "gspread>=6.1.2,<7.0.0",
  "coloredlogs>=15.0.1,<16.0.0", # For GCP logging
  # Vector database and RAG
  "chromadb>=0.5.0",
  "langchain>=0.3.21",
  "langchain-text-splitters>=0.3.7",
  "semchunk>=3.2.2",
  "huggingface-hub>=0.26.1,<1.0.0",
  "sentencepiece>=0.2.0,<1.0.0",
  # Web scraping and content extraction
  "beautifulsoup4>=4.12.3,<5.0.0",
  "readabilipy>=0.3.0",
  "newspaper4k>=0.9.3.1",
  "lxml[html-clean]>=5.3.0",
  "fake-useragent>=2.0.3",
  "bleach>=6.2.0,<7.0.0",
  "urllib3>=2.2.2,<3.0.0",
  "pillow>=10.0.0",
  "pdfminer-six==20240706",
  "json5>=0.10.0",
  "jq>=1.8.0,<2.0.0",
  "gql<4.0.0",
  # Multi-agent frameworks
  "autogen-core>=0.7.0",
  "autogen-agentchat>=0.4.9.2",
  "autogen-ext[azure,gemini,openai]>=0.7.0",
  "autogen-gemini>=0.0.1",
  # Tracing and observability
  # weave removed for performance optimization
  "traceloop-sdk>=0.38.5",
  "opentelemetry-api>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "opentelemetry-instrumentation>=0.50b0",
  "opentelemetry-instrumentation-openai>=0.33.0",
  "opentelemetry-instrumentation-logging>=0.56",
  "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
  "opentelemetry-exporter-gcp-trace>=1.9.0",
  "opentelemetry-exporter-gcp-monitoring>=1.8.0",
  "opentelemetry-exporter-gcp-logging>=1.8.0",
  "opentelemetry-semantic-conventions>=0.56",
  "opentelemetry-resourcedetector-gcp>=1.8",
  "sentry-sdk>=2.24.0",
