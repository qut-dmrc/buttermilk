  # AWS cloud support
  "boto3>=1.35.7,<2.0.0",
  # Azure cloud support
  "azureml-core>=1.57.0,<2.0.0",
  "azure-identity>=1.17.1,<2.0.0",
  "azure-keyvault>=4.2.0,<5.0.0",
  "azure-ai-contentsafety>=1.0.0,<2.0.0",
  "azure-cognitiveservices-vision-contentmoderator>=1.0.0,<2.0.0",
  "azure-ai-inference>=1.0.0b9",
  "azure-ai-ml==1.18.0",
  "azure-monitor-opentelemetry-exporter==1.0.0b41",
  "buttermilk[azure]",
  "replicate>=0.32.1,<1.0.0",
  "torch>=2.5.1,<3.0.0",
  "scipy>=1.15.3",
  "transformers>=4.44.2,<5.0.0",
  "evaluate>=0.4.2,<1.0.0",
  "peft>=0.12.0,<1.0.0",
  "einops>=0.8.0,<1.0.0",
  "hf-transfer>=0.1.8,<1.0.0",
  "loky>=3.4.1,<4.0.0",
]

# Development tools
dev = [
  
  # Development tools
  "pytest>=8.3.2",
  "pytest-mock>=3.14.0,<4.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "pytest-timeout>=2.3.1,<3.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "pytest-anyio>=0.0.0",
  "pytest-benchmark>=5.1.0",
  "ruff>=0.12.8",
  "dill>=0.4.0",
  "uv>=0.8.4",
  "mypy>=1.18.2",
  "pre-commit>=4.3.0",
  "radon>=6.0.1",

  # Research/academic tools
  "fastapi>=0.100.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "flask-restx>=1.3.0",
  "slack-bolt>=1.21.2,<2.0.0",
  "streamlit>=1.45.0",
  "shiny>=1.4.0",
  "aioconsole>=0.8.1",
  "pyzotero>=1.6.11",
  "themoviedb>=1.0.2",

  # Data tools
  "fsspec>=2024.6.1,<2025.0.0",
  "gcsfs>=2024.6.1,<2025.0.0",
  "pandas-stubs>=2.2.3.241126",
  "openpyxl>=3.1.5,<4.0.0",
  # Visualization
  "matplotlib>=3.9.2,<4.0.0",
  "seaborn>=0.13.2,<1.0.0",
  "plotly>=5.24.1,<6.0.0",
  "altair>=5.0.0",
  "tqdm>=4.66.5,<5.0.0",
  "cmap>=0.3.0,<1.0.0",
  # Notebook support
  "jupyter>=1.1.1",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
  # Extras
  "hydra-colorlog>=1.2.0,<2.0.0",
  "gradio>=5.4.0,<6.0.0",
  "opencv-python>=4.10.0.84,<5.0.0.0",
  "scikit-learn>=1.5.1,<2.0.0",
  "bump-my-version>=1.2.2",
]

# Everything (for backwards compatibility or quick start)
all = [
  "buttermilk[ml,dev]",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["buttermilk*", "examples*", "hydra_plugins*"]
exclude = ["tests*", "*.tests*", "*.tests"]
namespaces = true

[tool.setuptools.package-data]
buttermilk = [
  "conf/**/*.yaml",
  "conf/**/*.yml",
  "templates/**/*.jinja2",
  "templates/**/*.json",
  "templates/**/*.txt",
  "templates/**/*.md",
  "schemas/**/*.json",
  "schemas/**/*.sql",
  "toxicity/**/*.yaml",
  "toxicity/**/*.txt",
  "toxicity/**/*.jinja2",
]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.uv]
upgrade = true
default-groups = [] # Add the groups you want installed by default
prerelease = "if-necessary-or-explicit"

[tool.uv.sources]
buttermilk = { workspace = true }

[tool.black]
line-length = 150

[project.scripts]
bm = "buttermilk.runner.cli:main"

[project.entry-points."hydra_plugins"]
buttermilk_search_path_plugin = "hydra_plugins.buttermilk_search_path_plugin:ButtermilkSearchPathPlugin"

[tool.pytest.ini_options]
markers = [
  "integration: integration tests (slower, mocked and faked at the edges)",
  "endtoend: tests that require real API calls with valid credentials",
  "scheduled: mark tests to run in scheduled testing",
  "slow: mark tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = [
  "tests",
  "examples",
]

norecursedirs = ["docs", "*.egg-info", "*.egg", "bin", "demo", ".git", "appdir", ".tox", "mediamarkets", "scrapers"]
timeout = 600
# Note: Using pytest-anyio, not pytest-asyncio.
# Session-scoped event loop is achieved via session_runner fixture in conftest.py.
addopts = [
  "--continue-on-collection-errors",
  "--durations=10",
  "-n 20",
  "-q", # quiet - reduces output noise for TUI compatibility
  "-rfEX", # show extra summary info for failed/errors only
  "--tb=short",
  "-m",
  "not endtoend",
]

filterwarnings = [
  "ignore:Deprecated call to `pkg_resources.declare_namespace:DeprecationWarning",
  "ignore:Passing field metadata as keyword arguments is deprecated",
  "ignore:.*grpc_wait_for_shutdown_with_timeout.*:Warning",
  "ignore::pytest_benchmark.logger.PytestBenchmarkWarning",
]


[tool.ruff]
target-version = "py310"
line-length = 150 # Match buttermilk's style
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E", # pycodestyle errors
  "F", # pyflakes
  "W", # pycodestyle warnings
  "C90", # mccabe complexity
  "I", # isort
  "N", # pep8-naming
  "UP", # pyupgrade
  "B", # flake8-bugbear
  "A", # flake8-builtins
  "C4", # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "T10", # flake8-debugger
  "EM", # flake8-errmsg
  "ISC", # flake8-implicit-str-concat
  "ICN", # flake8-import-conventions
  "PIE", # flake8-pie
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "RSE", # flake8-raise
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "ARG", # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  "PL", # Pylint
  "RUF", # Ruff-specific rules
]

ignore = [
  "E501", # Line too long (handled by formatter)
  "PLR0913", # Too many arguments
  "PLR2004", # Magic value comparison
]

[tool.ruff.lint.mccabe]
max-complexity = 15 # Buttermilk is more complex than bot

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "ARG", # Unused arguments common in fixtures
  "PLR2004", # Magic values OK in tests
]

