    "psutil>=5.9.5,<6.0.0",
    "httpx>=0.27.2,<1.0.0",
    "requests>=2.32.3,<3.0.0",
    "rich>=13.9.4,<14.0.0",
    "anyio>=4.7.0,<5.0.0",
    # LLM core (always needed for AI features)
    "litellm>=1.0.0",
    "anthropic[vertex]>=0.42.0,<1.0.0",
    # Basic data structures
    "numpy>=1.26.4",
    "pandas>=2.3.0",
    # JSON/data handling
    "json-repair>=0.28.3,<1.0.0",
    "jsonschema>=4.0.0,<5.0.0",
    "marshmallow==3.23.2",
    # File paths
    "cloudpathlib>=0.20.0,<1.0.0",
    "pathlib>=1.0.1,<2.0.0",
    # Utilities
    "regex>=2024.9.11,<2025.0.0",
    "unidecode>=1.3.8,<2.0.0",
    "validators>=0.33.0,<1.0.0",
    "keyring>23.4.0",
    # GCP cloud support
    "google-cloud-storage>=2.19.0,<3.0.0",
    "google-cloud-bigquery>=3.27.0,<4.0.0",
    "google-cloud-bigquery-storage>=2.27.0,<3.0.0",
    "google-cloud-secret-manager>=2.22.0,<3.0.0",
    "google-cloud-aiplatform>=1.74.0,<2.0.0",
    "google-cloud-logging>=3.11.2,<4.0.0",
    "google-cloud-language>=2.15.1,<3.0.0",
    "google-cloud-pubsub>=2.27.1,<3.0.0",
    "google-generativeai>=0.7.2,<1.0.0",
    "google-genai[aiohttp]>=1.25.0",
    "google-crc32c>=1.6.0,<2.0.0",
    "proto-plus>=1.25.0,<2.0.0",
    "db-dtypes>=1.3.1,<2.0.0",
    "gspread>=6.1.2,<7.0.0",
    "coloredlogs>=15.0.1,<16.0.0", # For GCP logging
    # Vector database and RAG
    "chromadb>=0.5.0",
    "langchain>=0.3.21",
    "langchain-text-splitters>=0.3.7",
    "semchunk>=3.2.2",
    "huggingface-hub>=0.26.1,<1.0.0",
    "sentencepiece>=0.2.0,<1.0.0",
    # Web scraping and content extraction
    "beautifulsoup4>=4.12.3,<5.0.0",
    "readabilipy>=0.3.0",
    "newspaper4k>=0.9.3.1",
    "lxml[html-clean]>=5.3.0",
    "fake-useragent>=2.0.3",
    "bleach>=6.2.0,<7.0.0",
    "urllib3>=2.2.2,<3.0.0",
