defaults:
  - /flows@transllm: trans
  - /agents@transllm.observers: host/llm_host

transllm:
  observers:
    host:
      task: |
        Receive a URL from the MANAGER and call on participants in this order unless directed by the MANAGER to do otherwise: FETCH the URL, JUDGE the content based on the criteria, and SYNTHESIZE a summary of your findings.

  storage: {}

  # These will be populated by the defaults
  agents: {}
