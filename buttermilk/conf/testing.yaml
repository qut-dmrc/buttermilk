defaults:
  - flows@run.flows:
    - trans
  - llms@run.llms: debug
  - _self_

project_name: buttermilk
job: testing
verbose: true

run:
  mode: console

#  Testing paths for bigquery datasets
storage:
  observations:
    full_table_id: "prosocial-443205.testing.observations"
  titles:
    full_table_id: "prosocial-443205.bmdev_testing.titles_tmdb"
    batch_size: 2
  traces:
    type: bigquery
    project_id: prosocial-443205
    dataset_id: testing
    table_id: traces
    dataset_name: traces
    schema_path: traces.schema.json


session:
  template_paths: []
  sessions_dir: "data/sessions"
  cache_dir: "~/.cache/buttermilk"

infrastructure:
  clouds:
    - type: gcp
      _target_: buttermilk._core.cloud_config.GCPConfig    
      project_id: prosocial-443205
      region: us-central1
      location: us-central1
      storage_bucket: prosocial-dev
      secrets:
        _target_: buttermilk._core.cloud_config.SecretsServiceConfig
        models_secret: dev__llm__connections
        credentials_secret: dev__shared_credentials
      logging:
        _target_: buttermilk._core.cloud_config.LoggingServiceConfig
        enabled: true
        verbose: true
      pubsub:
        _target_: buttermilk._core.cloud_config.PubSubServiceConfig
        jobs_topic: jobs
        jobs_subscription: jobs-sub
        status_topic: flow
        status_subscription: flow-sub
      vertex:
        enabled: true
      
  # Unified tracing configuration for all tracing providers
  tracing:
    weave: 
      enabled: false
      # project_id is WANDB_ENTITY for weave
      project_id: dmrc
      api_key: 
    traceloop:
      enabled: false
      api_key: 
      endpoint: https://api.traceloop.com
    otel:
      enabled: true
      endpoint: https://telemetry.googleapis.com
      otlp_headers: {}
      
  logging:
    type: gcp
    verbose: ${verbose}
    project_id: prosocial-443205
    location: us-central1


zotero:
  _target_: buttermilk.libs.zotero.ZoteroSource
  library_id: ${oc.env:ZOTERO_LIBRARY_ID}
  save_dir: ${oc.env:HOME}/.cache/buttermilk/zotero/state
  filter:
    _target_: buttermilk.libs.zotero.VectorStoreExistenceFilter
    vector_store: 
      type: chromadb
      collection_name: prosocial_zot
      read_only: true
      persist_directory: gs_prosocial-dev_data_zotero-prosocial-fulltext_files
      embedding_model: gemini-embedding-001
      dimensionality: 3072

  force_full_sync: false

