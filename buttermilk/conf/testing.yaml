defaults:
  - _self_
  - local
  - flows:
    - zot
    - trans
    - osb
  - llms: lite

verbose: true

bm:
  _target_: buttermilk._core.bm_init.BM
  session_info:
    name: buttermilk
    job: testing

infrastructure:
  clouds:
    - type: gcp
      _target_: buttermilk._core.cloud_config.GCPConfig
      project_id: prosocial-443205
      region: us-central1
      location: us-central1
      storage_bucket: prosocial-dev
      
  # Unified tracing configuration for all tracing providers
  tracing:
    weave: 
      enabled: true
      # project_id is WANDB_ENTITY for weave
      project_id: dmrc
      api_key: 14b169c3bc7460cf21789b8144a39a166504d0ec
    traceloop:
      enabled: false
      api_key: tl_b198e9224e6b4bfb801a1eff1a35addf
      endpoint: https://api.traceloop.com
    otel:
      enabled: true
      # OpenTelemetry tracing (formerly under GCP cloud config)
      endpoint: https://telemetry.googleapis.com
      otlp_headers: {}
      
  logging:
    type: local
    verbose: ${verbose}