defaults:
  - env: testing
  - flows:
    - zot
    - trans
    - osb
  - llms: debug
  - _self_

verbose: true

#  Testing paths for bigquery datasets
storage:
  observations:
    full_table_id: "prosocial-443205.testing.observations"
  titles:
    full_table_id: "prosocial-443205.bmdev_testing.titles_tmdb"
    batch_size: 2
  traces:
    type: bigquery
    project_id: prosocial-443205
    dataset_id: testing
    table_id: traces
    dataset_name: traces
    schema_path: traces.schema.json


bm:
  _target_: buttermilk._core.bm_init.BM
  session_info:
    name: testing
    job: tests

infrastructure:
  clouds:
    - type: gcp
      _target_: buttermilk._core.cloud_config.GCPConfig    
      project_id: prosocial-443205
      region: us-central1
      location: us-central1
      storage_bucket: prosocial-dev
      secrets:
        _target_: buttermilk._core.cloud_config.SecretsServiceConfig
        models_secret: dev__llm__connections
        credentials_secret: dev__shared_credentials
      logging:
        _target_: buttermilk._core.cloud_config.LoggingServiceConfig
        verbose: true
      pubsub:
        _target_: buttermilk._core.cloud_config.PubSubServiceConfig
        jobs_topic: jobs
        jobs_subscription: jobs-sub
        status_topic: flow
        status_subscription: flow-sub
      vertex:
        enabled: true
      
  # Unified tracing configuration for all tracing providers
  tracing:
    weave: 
      enabled: false
      # project_id is WANDB_ENTITY for weave
      project_id: dmrc
      api_key: 
    traceloop:
      enabled: false
      api_key: 
      endpoint: https://api.traceloop.com
    otel:
      enabled: true
      endpoint: https://telemetry.googleapis.com
      otlp_headers: {}
      
  logging:
    type: local
    verbose: ${verbose}

run:
  mode: pytest

flows: {}

pipeline:
  _target_: buttermilk.pipeline.PipelineOrchestrator
  stage_name: testing_processor
  source: ${storage.titles}
  concurrency: 1
  processors: {}

