defaults:
  - llms: lite
  - _self_
project_name: buttermilk
job: testing
verbose: true
run:
  mode: console
#  Testing paths for bigquery datasets
storage:
  observations:
    full_table_id: "prosocial-443205.testing.observations"
  titles:
    full_table_id: "prosocial-443205.bmdev_testing.titles_tmdb"
    batch_size: 2
  traces:
    type: bigquery
    project_id: prosocial-443205
    dataset_id: testing
    table_id: traces
    dataset_name: traces
    schema_path: traces.schema.json
  zotero_vectors:
    type: chromadb
    collection_name: prosocial_zot
    read_only: true
    persist_directory: /chromadb
    embedding_model: gemini-embedding-001
    dimensionality: 3072
session:
  llm_wrapper: litellm
  template_paths: []
  sessions_dir: "data/sessions"
  cache_dir: "~/.cache/buttermilk"
infrastructure:
  clouds:
    - type: gcp
      _target_: buttermilk._core.cloud_config.GCPConfig
      project_id: prosocial-443205
      region: us-central1
      location: us-central1
      storage_bucket: prosocial-dev
      secrets:
        _target_: buttermilk._core.cloud_config.SecretsServiceConfig
        models_secret: dev__llm__connections
        credentials_secret: dev__shared_credentials
      logging:
        _target_: buttermilk._core.cloud_config.LoggingServiceConfig
        enabled: true
        verbose: true
      vertex:
        enabled: true
  # Unified tracing configuration (weave/wandb removed - use Google Cloud Trace)
  tracing:
    traceloop:
      enabled: false
      api_key:
      endpoint: https://api.traceloop.com
    otel:
      enabled: true
      endpoint: https://telemetry.googleapis.com
      otlp_headers: {}
  logging:
    type: gcp
    verbose: ${verbose}
    project_id: prosocial-443205
    location: us-central1
vectoriser:
  _target_: buttermilk.data.vector.ChromaDBEmbeddings
  persist_directory: ${storage.zotero_vectors.persist_directory}
  collection_name: ${storage.zotero_vectors.collection_name}
  embedding_model: ${storage.zotero_vectors.embedding_model}
  dimensionality: ${storage.zotero_vectors.dimensionality}
  concurrency: 1
  sync_batch_size: 500
  deduplication_strategy: record_id # Skip existing records before downloading
  enable_record_cache: true
pipelines:
  image_generation:
    name: image_generation
    description: "Generate images using character-based prompts across multiple models"
    # Character-based prompt source
    source:
      _target_: buttermilk.data.sources.character_prompt_source.CharacterPromptSource
      mask_attributes:
        - sexuality
        - gender
    # Processing stages
    processors:
      # 1. Expand to multiple repetitions × models
      - _target_: buttermilk.processors.batch_expansion.BatchExpansionProcessor
        repetitions: 3
        models:
          # Use cheap models for cost control
          - _target_: buttermilk.agents.imagegen.VertexImagen3Fast
          - _target_: buttermilk.agents.imagegen.VertexImagen4Fast
      # 2. Generate images via Vertex AI
      - _target_: buttermilk.processors.image_generation.ImageGenerationProcessor
        # Model class specified in record.metadata
      # 3. Upload to GCS with structured paths
      - _target_: buttermilk.processors.gcs_image_storage.GCSImageStorageProcessor
        bucket: prosocial-dev
        base_path: "image-generation"
      # 4. Log all metadata to CSV
      - _target_: buttermilk.processors.csv_metadata_logger.CSVMetadataLogger
        bucket: prosocial-dev
        base_path: "image-generation"
