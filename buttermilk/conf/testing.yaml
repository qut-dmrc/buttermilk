defaults:
  - _self_
  - local
  - flows:
    - zot
    - trans
    - osb
  - llms: lite

verbose: true

bm:
  _target_: buttermilk._core.bm_init.BM
  session_info:
    name: ${run.name}
    job: ${run.job}

infrastructure:
  clouds:
    - type: gcp
      _target_: buttermilk._core.cloud_config.GCPConfig
      project_id: prosocial-443205
      region: us-central1
      location: us-central1
      storage_bucket: prosocial-dev
      
  # Unified tracing configuration for all tracing providers
  tracing:
    weave: 
      enabled: false
      # project_id is WANDB_ENTITY for weave
      project_id: dmrc
      api_key: 
    traceloop:
      enabled: false
      api_key: 
      endpoint: https://api.traceloop.com
    otel:
      enabled: true
      endpoint: https://telemetry.googleapis.com
      otlp_headers: {}
      
  logging:
    type: local
    verbose: ${verbose}

run:
  mode: pytest
  ui: console
  human_in_loop: false

  name: testing
  job: tests

  flows: ${flows}
