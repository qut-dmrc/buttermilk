# Simple sequence-based host that executes steps in order
# This is the consolidated version of the sequencer host
host:
  role: HOST
  name: "Sequence Coordinator"
  agent_obj: HostAgent
  parameters:
    human_in_loop: false
    execution_mode: "sequential"  # Execute agents in defined order
    max_wait_time: 180  # Maximum time to wait per step in seconds
    error_threshold: 0.3  # Maximum acceptable error ratio before proceeding to next step
