# LLM-based host that delegates using structured tools
# This is the consolidated version of assistant/explorer/ra hosts
host:
  role: HOST
  name: "Intelligent Coordinator"
  description: "Intelligent coordinator that helps users with tasks by orchestrating other agents"
  agent_obj: StructuredLLMHostAgent
  parameters:
    model: ${llms.host}
    human_in_loop: false
    template: lead_ra  # Configurable template
    task: "Assist the user by delegating tasks to appropriate agents. Continuously monitor progress and adapt the workflow based on results."
    max_wait_time: 180  # Maximum time to wait per step in seconds
    error_threshold: 0.3  # Maximum acceptable error ratio before proceeding to next step