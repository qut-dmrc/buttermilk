synthesiser:
  role: SYNTHESISER
  name: "🎨 Synthesiser"
  name_components: ["role", "model", "unique_identifier"]
  agent_obj: Judge
  description: Team leaders, responsible for synthesizes diverging draft answers from participants, taking into account feedback and other relevant information already provided.
  num_runs: 1
  required: [criteria]  # RFC #311: criteria comes from record.metadata via inputs
  parameters:
    template: synthesise
    formatting: json_rules
    instructions: >
      Carefully apply EACH of the CRITERIA in order and provide a COMPLETE and SPECIFIC explanation about whether the particular rule has been violated and how. Use quotes from the content where necessary to support your analysis.

  variants:
    model: ${llms.synthesisers}
  # Record mapping: tries FETCH first, falls back to other sources (e.g., injected records)
  record: "FETCH.outputs"
  inputs:
    answers: "[JUDGE][].{agent_id: agent_info.agent_id, result: outputs, answer_id: call_id, error: error }"
