scorer:
  role: SCORERS
  name_components: ["📊", "role", "model", "unique_identifier"]
  agent_obj: LLMAgent
  num_runs: 2
  description: Checks and scores answers against our expected ground truth.
  variants:
    model: ${llms.judgers}
  parameters:
    output_model: "tja.types.QualScore"
    template: score
  inputs:
    model: "*.agent_info.parameters.model|[0]"
    criteria: "*.agent_info.parameters.criteria|[0]"
    template: "*.agent_info.parameters.template|[0]"
    record: "[FETCH.outputs]||*.record||*.inputs.record"
    expected: "[FETCH.outputs].ground_truth||*.record.ground_truth||*.inputs.record.ground_truth"
    answers: "[JUDGE,SYNTHESISER][].{agent_id: agent_info.agent_id, result: outputs, answer_id: call_id, error: error }"
