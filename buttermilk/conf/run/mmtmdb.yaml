# @package _global_

defaults:
  - _self_
  - /storage@pipeline.source: tmdbtitles
  - /storage@pipeline.output: observations

run:
  mode: pipeline
  name: mediamarkets
  job: observations_tmdb

pipeline:
  # Storage config for input data with decade-based sampling
  source:
    # SQL query to sample n/14 random records from each decade
    custom_query: |
      WITH decade_samples AS (
        SELECT *,
          FLOOR(year / 10) * 10 AS decade,
          ROW_NUMBER() OVER (PARTITION BY FLOOR(year / 10) * 10 ORDER BY RAND()) AS rn
        FROM {table}
        WHERE dataset_name = 'tmdbtitles'
          AND year IS NOT NULL
          AND year >= 1900
          AND year < 2030
      )
      SELECT * EXCEPT(decade, rn)
      FROM decade_samples
      WHERE rn <= CEIL({n} / 14.0)
      ORDER BY year, RAND()
      LIMIT {n}

  # Number of samples to collect (will be distributed across decades)
  samples_per_run: 1000  # ~71 records per decade

  tmdb:
    batch_size: 10

  # Storage config for output
  output: {}

  buffer_size: 10
  flush_interval: 30
  batch_size: 100 # For simple pipeline

  # Optional: Use orchestrator for concurrency
  use_orchestrator: true
  concurrency: 20
  max_records: 1000
