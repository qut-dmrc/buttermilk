# @package _global_

defaults:
  - /storage@run.pipeline.source: tmdbtitles
  - /storage@run.pipeline.output: observations

project_name: mediamarkets
job: observations_tmdb

run:
  mode: pipeline
  limit: 10000
  pipeline:
    # Pipeline execution parameters
    pipeline_name: "tmdb_observations"
    description: "Enrich titles with TMDB streaming availability data"
    concurrency: 20
    max_records: null # null = process all
    enable_record_cache: false
    force_reprocess: false 
    # Number of samples to collect from database (will be distributed across decades)
    sample_size: 10000 # ~700 records per decade
    # Source: BigQuery with decade-based sampling
    source:
      type: bigquery
      # Defaults from /storage@run.pipeline.source: tmdbtitles will fill in project_id, dataset_id, etc.
      limit: ${run.pipeline.sample_size}  # Passes sample_size to storage for {n} substitution
      custom_query: |
        DECLARE n INT64 DEFAULT {n};
        DECLARE limit_val INT64 DEFAULT CAST(n * 0.5 AS INT64);

        WITH
        -- Exclude titles processed in the last 14 days
        processed_recently AS (
            SELECT DISTINCT record_id
            FROM `prosocial-443205.mediamarkets.observations`
            WHERE test_date >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 14 DAY)
        ), 
        candidates AS (
            SELECT t.*
            FROM {table} t
            LEFT JOIN processed_recently p ON CAST(t.record_id AS STRING) = p.record_id
            WHERE p.record_id IS NULL
              AND t.year IS NOT NULL
              AND t.year >= 1900
              AND t.year < 2030
        ),
        -- Floor: 0.5n records with per-decade distribution (~0.5n/14 per decade)
        decade_floor AS (
          SELECT *,
              ROW_NUMBER() OVER (PARTITION BY DIV(year, 10) * 10 ORDER BY RAND()) AS rn
          FROM candidates
        ),
        floor_records AS (
          SELECT * EXCEPT(rn)
          FROM decade_floor
          WHERE rn <= CEIL(n * 0.5 / 14.0)
        ),
        -- Random: 0.5n additional random records
        random_base AS (
          SELECT *, ROW_NUMBER() OVER (ORDER BY RAND()) as rn_rand
          FROM candidates
        ),
        random_records AS (
          SELECT * EXCEPT(rn_rand)
          FROM random_base
          WHERE rn_rand <= limit_val
        )
        -- Combined and deduplicated (final count may be < n due to overlap)
        SELECT * FROM floor_records
        UNION DISTINCT
        SELECT * FROM random_records
    # Processors: TMDB enrichment + upload
    processors:
      # Step 1: TMDB processor to fetch streaming availability
      - _target_: buttermilk.tools.catalog_test.TMDBTool
        # TMDB config (empty = use defaults)
      # Step 2: Upload results to output storage
      - _target_: buttermilk.utils.uploader.AsyncDataUploader
        storage: ${run.pipeline.output}
        buffer_size: 500
        flush_interval: 30
    # Output: Storage for processed observations (filled by defaults)
    output: {}
