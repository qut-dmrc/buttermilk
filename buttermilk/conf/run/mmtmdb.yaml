# @package _global_

defaults:
  - /storage@run.pipeline.source: tmdbtitles
  - /storage@run.pipeline.output: observations

project_name: mediamarkets
job: observations_tmdb

run:
  mode: pipeline
  limit: 10000
  pipeline:
    # Pipeline execution parameters
    pipeline_name: "tmdb_observations"
    description: "Enrich titles with TMDB streaming availability data"
    concurrency: 20
    max_records: null # null = process all
    enable_record_cache: false
    force_reprocess: false 
    # Number of samples to collect from database (will be distributed across decades)
    sample_size: 10000 # ~700 records per decade
    # Source: BigQuery with decade-based sampling
    source:
      type: bigquery
      # Defaults from /storage@run.pipeline.source: tmdbtitles will fill in project_id, dataset_id, etc.
      limit: ${run.pipeline.sample_size}  # Passes sample_size to storage for {n} substitution
      custom_query: |
