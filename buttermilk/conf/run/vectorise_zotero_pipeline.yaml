# @package _global_

# Enhanced Zotero vectorization using pipeline architecture
# Usage: python -m buttermilk.pipeline run=vectorise_zotero_pipeline +storage=zot

defaults:
  - _self_
  - /storage/zot

run:
  name: zotero_vectorizer_pipeline
  job: zotero

# Pipeline configuration
pipeline:
  _target_: buttermilk.pipeline.PipelineOrchestrator
  stage_name: zotero_vectorization_pipeline
  source:
    _target_: buttermilk.libs.zotero.ZotDownloader
    library: ${oc.env:ZOTERO_LIBRARY_ID}
    save_dir: ${oc.env:HOME}/.cache/zotero/items
    local: ${oc.env:ZOTERO_LOCAL}
    download_concurrency: 8

  concurrency: 4
  max_records: 50000

  processors:
    # 1. PDF text extraction
    - _target_: buttermilk.tools.pdf_extractor.PdfTextExtractor
      save_dir: ${oc.env:HOME}/.cache/zotero/items

    # 2. Optional citation processing
    - _target_: buttermilk.tools.citator.Citator
      parameters:
        model: gemini25flash

    # 3. Text chunking
    - _target_: buttermilk.data.vector.SemanticSplitter
      chunk_size: 1700
      chunk_overlap: 400

    # 4. Generate embeddings
    - _target_: buttermilk.processors.embeddings.EmbeddingGenerator
      embedding_model: ${storage.embedding_model}
      dimensionality: ${storage.dimensionality}
      task: RETRIEVAL_DOCUMENT
      embedding_batch_size: 100

    # 5. Upload to ChromaDB
    - _target_: buttermilk.processors.chromadb_uploader.ChromaDBUploader
      collection_name: ${storage.collection_name}
      persist_directory: ${storage.persist_directory}
      sync_batch_size: 2000
      sync_interval_minutes: 300