# @package _global_

# Re-scoring Pipeline Configuration
#
# Purpose: Score existing JUDGE/SYNTH predictions that lack scores
#
# This pipeline demonstrates composable, config-driven data processing:
# 1. SQL filter extracts unscored predictions from BigQuery
# 2. JMESPath transform prepares data for scorer template
# 3. LLMCore runs scoring LLM
# 4. Results written back to BigQuery traces table
#
# Usage:
#   uv run python -m buttermilk.cli pipeline run --config-name rescore
#   uv run python -m buttermilk.cli pipeline run --config-name rescore max_records=100

defaults:
  - /storage@run.pipeline.source: traces
  - /storage@run.pipeline.output: traces
  - _self_

job: rescore
project_name: tja  

run:
  mode: pipeline

  pipeline:
    # Pipeline execution parameters
    pipeline_name: "rescore_unscored_predictions"
    description: "Re-score JUDGE/SYNTH predictions missing scores"
    concurrency: 5
    max_records: null  # null = process all, set to integer for testing
    enable_record_cache: true
    force_reprocess: false

    # SQL to find predictions that were never scored
    source:

      custom_query: |
        WITH unscored_predictions AS (
          SELECT DISTINCT t.call_id
          FROM `prosocial-443205.testing.traces` t
          LEFT JOIN `prosocial-443205.testing.traces` scorer
            ON JSON_VALUE(t.inputs, '$.inputs.record_id') = JSON_VALUE(scorer.inputs, '$.inputs.record_id')
            AND JSON_VALUE(scorer.agent_info, '$.role') = 'SCORER'
            AND JSON_VALUE(scorer.agent_info, '$.config.parameters.model') = JSON_VALUE(t.agent_info, '$.config.parameters.model')
          WHERE JSON_VALUE(t.agent_info, '$.role') IN ('JUDGE', 'SYNTHESISER')
            AND t.outputs.prediction IS NOT NULL
            AND t.error IS NULL
            AND scorer.call_id IS NULL
            AND JSON_VALUE(t.agent_info, '$.config.parameters.model') IN ('gemini25pro', 'claude45sonnet', 'gemini25flash')
        )
        SELECT
          t.*,
          r.ground_truth AS expected
        FROM `prosocial-443205.testing.traces` t
        INNER JOIN unscored_predictions u ON t.call_id = u.call_id
        INNER JOIN `prosocial-443205.bmdev.tja_records` r
          ON JSON_VALUE(t.inputs, '$.inputs.record_id') = r.record_id
        
    # PROCESSORS: Transform data then run scorer
    processors:
      # Step 1: Transform ExecutionTrace → scorer template inputs
      - _target_: buttermilk.processors.jmespath_transform.JMESPathTransform
        mappings:
          # Extract data from ExecutionTrace and map to scorer template variables
          # These JMESPath expressions match what scorer.yaml expects
          answers: "[].{agent_id: agent_info.agent_id, result: outputs, answer_id: call_id, error: error}"
          criteria: "parameters.criteria || `[]`"
          parent_call_id: "call_id"  # Link scores back to original prediction

      # Step 2: Run scoring LLM (LLMCore already implements Processor protocol)
      - _target_: buttermilk._core.llm_core.LLMCore
        model: "gemini25pro"  # Or use: ${run.llms.scorers[0]} to reference global config
        template: "score"
        output_model: "buttermilk.agents.evaluators.scorer.QualScore"
        output_col: "score_results"
        fail_on_unfilled_parameters: true

