defaults:
  - local
  - run: cli
  - llms: lite
  - _self_

# reduce path-induced surprises
hydra.job.chdir: false

verbose: false
flows: {}

bm:
  _target_: buttermilk._core.bm_init.BM
  session_info:
    name:
    job:
    template_paths: []
    # Session storage configuration
    sessions_dir: "data/sessions"
    # These defaults are currently not loaded properly.
    session:
      timeout_minutes: 60
      cleanup_interval_minutes: 15
      max_concurrent_sessions: 50

infrastructure:
  llms: {}

  # Default tracing configuration for non-cloud tracing providers
  tracing:
    weave:
      enabled: true
    traceloop:
      enabled: false