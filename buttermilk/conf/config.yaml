defaults:
  - local
  - _self_

# reduce path-induced surprises
hydra.job.chdir: false

verbose: false
flows: {}

session:
  project_name: ${project_name}
  job: ${job}
  template_paths: []
  # Session storage configuration
  sessions_dir: "data/sessions"
  cache_dir: "~/.cache/buttermilk"
  # Session timeout and cleanup settings
  timeout_minutes: 60
  cleanup_interval_minutes: 15
  max_concurrent_sessions: 50

infrastructure:
  llms: {}

  # Default tracing configuration for non-cloud tracing providers
  tracing:
    weave:
      enabled: true
    traceloop:
      enabled: false