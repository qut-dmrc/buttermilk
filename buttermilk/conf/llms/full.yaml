host: gemini-flash

general:
  - gemini-flash
  - claude-sonnet

judgers:
  - gemini-pro
  - gemini-flash
  - claude-sonnet

synthesisers:
  - gemini-pro
  - gemini-flash
  - claude-sonnet

# Model-specific parameter overrides
# These override the defaults from models.json for this llms config
model_parameters:
  gemini-flash:
    temperature: 0.7
    max_tokens: 8192
  gemini-pro:
    temperature: 0.3
    max_tokens: 8192
  claude-sonnet:
    temperature: 0.5
    max_tokens: 4096
