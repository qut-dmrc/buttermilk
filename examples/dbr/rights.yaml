# frame Flow - Clean version with hierarchical composition
# This flow uses Hydra's composition to pull in reusable components


    agents:
      # loading agents here because sequence matters for sequence_host
      fetch: ${/agents.fetch}
      differences: ${/agents.differences}
      dbr:
        role: DBR
        name: "RightsExtractor"
        description: Expert analysts who can extract features from declarations and bills of rights
        agent_obj: LLMAgent
        num_runs: 1
        parameters:
          template: dbr
        variants:
          model: ${llms.general}
        inputs:
          records: "[FETCH.outputs]||*.records[]"
