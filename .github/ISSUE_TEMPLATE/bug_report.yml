name: Bug report
description: Something in buttermilk is broken or behaves unexpectedly.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in the relevant fields below — the more specific you are, the faster we can help.

        For security issues, see [SECURITY.md](https://github.com/qut-dmrc/buttermilk/blob/stable/SECURITY.md) and do **not** file a public issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: "When I run `bm run.flow=...`, it ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reliably reproduce the bug. Include the flow / agent / config you were running.
      placeholder: |
        1. `uv sync --extra dev`
        2. Run `bm run.mode=console run.flow=...`
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / traceback
      description: Paste any error output. Use ``` triple-backticks for formatting.
      render: shell

  - type: input
    id: buttermilk-version
    attributes:
      label: Buttermilk version
      description: Run `python -c "import buttermilk; print(buttermilk.__version__)"`.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.10"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 14.5, ..."
    validations:
      required: true
