name: Feature request
description: Suggest a new feature, capability, or improvement.
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to buttermilk. Please describe the research or engineering motivation — knowing *why* helps us prioritise and design well.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What's missing or hard right now? What research workflow does this affect?
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Your idea for how this could work. Code sketches, config examples, or API shapes welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they don't fit.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to related issues, papers, prior art, or relevant background.
