# Checks that run on every PR to dev: lint, gatekeeper, type-check, unit-tests.
# Lint and gatekeeper run in parallel; type-check and unit-tests run after lint.
# The review pipeline (pr-review-pipeline.yml) starts only after ALL jobs
# here pass, via a workflow_run trigger.

name: PR Checks

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, assigned]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Stage 1: Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      # Initial check: identify problems but don't fail the job yet
      - name: Ruff lint (initial)
        id: lint-initial
        continue-on-error: true
        run: uv run ruff check --output-format=github

      - name: Ruff format check (initial)
        id: format-initial
        continue-on-error: true
        run: uv run ruff format --check

      # Autofix and push if either check found problems
      - name: Autofix lint and formatting
        if: steps.lint-initial.outcome == 'failure' || steps.format-initial.outcome == 'failure'
        run: |
          uv run ruff check --fix || true
          uv run ruff format

      - name: Commit and push fixes
        if: steps.lint-initial.outcome == 'failure' || steps.format-initial.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes to commit"
          else
            git commit -m "style: autofix lint and formatting"
            git push
          fi

      # Final gate: re-check after fixes (or confirm clean on first pass)
      - name: Ruff lint (final)
        if: steps.lint-initial.outcome == 'failure'
        run: uv run ruff check --output-format=github

      - name: Ruff format check (final)
        if: steps.format-initial.outcome == 'failure'
        run: uv run ruff format --check

  # ──────────────────────────────────────────────
  # Gatekeeper (alignment + quality gate)
  # Runs in parallel with lint — no dependencies.
  # ──────────────────────────────────────────────
  gatekeeper:
    name: Gatekeeper
    uses: ./.github/workflows/agent-gatekeeper.yml
    with:
      pr_number: ${{ github.event.pull_request.number }}
      head_ref: ${{ github.event.pull_request.head.ref }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # Stage 2: Type Check (after lint)
  # ──────────────────────────────────────────────
  type-check:
    name: Type Check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run mypy
        run: uv run mypy buttermilk --ignore-missing-imports

  # ──────────────────────────────────────────────
  # Stage 2: Unit Tests (after lint, on auto-fixed code)
  # ──────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: |
          uv run pytest tests/ \
            -m "not integration" \
            --cov=buttermilk \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
