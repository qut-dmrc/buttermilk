name: Build and Push Docker Image

on:
  push:
    branches:
      - stable
      - dev
  workflow_dispatch: # Allows manual triggering of the workflow

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/984609701316/locations/global/workloadIdentityPools/devops/providers/github-actions'
          service_account: 'services@prosocial-443205.iam.gserviceaccount.com'

      - name: 'Set up gcloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Register gcloud as a Docker credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
        
      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('deploy/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      - name: Set Docker tag
        id: docker_tag
        run: |
          # Get branch name and make it Docker tag friendly (replace / with -)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo $BRANCH_NAME | sed 's/\//-/g')
          echo "branch_tag=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Building for branch: $BRANCH_NAME (tag: $SAFE_BRANCH)"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          file: ./deploy/Dockerfile
          tags: |
            us-central1-docker.pkg.dev/prosocial-443205/reg/buttermilk:${{ steps.docker_tag.outputs.branch_tag }}
            us-central1-docker.pkg.dev/prosocial-443205/reg/buttermilk:${{ steps.docker_tag.outputs.branch_tag }}-${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache



