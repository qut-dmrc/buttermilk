name: Build and Push Docker Image
on:
  push:
    branches:
      - stable
  pull_request:
    branches: [stable]
  workflow_dispatch: # Allows manual triggering of the workflow
permissions:
  id-token: write
  contents: read
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
      - name: 'Set up gcloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Register gcloud as a Docker credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev
      - name: Set Docker tag
        id: docker_tag
        run: |
          # Get branch name and make it Docker tag friendly (replace / with -)
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          SAFE_BRANCH=$(echo $BRANCH_NAME | sed 's/\//-/g')
          echo "branch_tag=$SAFE_BRANCH" >> $GITHUB_OUTPUT
          echo "Building for branch: $BRANCH_NAME (tag: $SAFE_BRANCH)"
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # (no push on PRs)
          push: ${{ github.event_name == 'push' }}
          # Attestations/SBOM can slow builds and require push; disable by default
          provenance: false
          sbom: false
          platforms: linux/amd64
          file: ./containers/deploy/Dockerfile
          tags: |
            us-central1-docker.pkg.dev/prosocial-443205/reg/buttermilk:${{ steps.docker_tag.outputs.branch_tag }}
            us-central1-docker.pkg.dev/prosocial-443205/reg/buttermilk:${{ steps.docker_tag.outputs.branch_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push dev image
        uses: docker/build-push-action@v5
        with:
          # (no push on PRs)
          push: ${{ github.event_name == 'push' }}
          # Attestations/SBOM can slow builds and require push; disable by default
          provenance: false
          sbom: false
          platforms: linux/amd64
          file: ./containers/dev/Dockerfile
          tags: |
            us-central1-docker.pkg.dev/prosocial-443205/reg/bmdev:${{ steps.docker_tag.outputs.branch_tag }}
            us-central1-docker.pkg.dev/prosocial-443205/reg/bmdev:${{ steps.docker_tag.outputs.branch_tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
