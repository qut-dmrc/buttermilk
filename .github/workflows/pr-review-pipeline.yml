# LLM review pipeline. Runs only after PR Checks (lint + gatekeeper + type-check
# + unit-tests) all pass, via a workflow_run trigger. This avoids re-running
# expensive LLM reviews on every push.
#
# All three review agents run in parallel after setup.
# Merge agent lives in pr-merge.yml (separate triggers).

name: PR Pipeline

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: number

jobs:
  # ──────────────────────────────────────────────
  # Setup: extract PR metadata from workflow_run
  # ──────────────────────────────────────────────
  setup:
    name: Setup
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr-info.outputs.pr_number }}
      head_ref: ${{ steps.pr-info.outputs.head_ref }}
    steps:
      - name: Extract PR info
        id: pr-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PR_NUMBER="${{ github.event.inputs.pr_number }}"
            HEAD_REF=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          else
            # workflow_run exposes the PR that triggered the checks
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
            HEAD_REF="${{ github.event.workflow_run.pull_requests[0].head.ref }}"
          fi

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "::error::Could not determine PR number"
            exit 1
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "PR #$PR_NUMBER on branch $HEAD_REF"

  # ──────────────────────────────────────────────
  # Review agents — all run in parallel
  # ──────────────────────────────────────────────
  strategic-review:
    name: Strategic Review
    needs: [setup]
    uses: ./.github/workflows/agent-strategic-review.yml
    with:
      pr_number: ${{ needs.setup.outputs.pr_number }}
      head_ref: ${{ needs.setup.outputs.head_ref }}
    secrets: inherit

  custodiet:
    name: Custodiet
    needs: [setup]
    uses: ./.github/workflows/agent-custodiet.yml
    with:
      pr_number: ${{ needs.setup.outputs.pr_number }}
      head_ref: ${{ needs.setup.outputs.head_ref }}
    secrets: inherit

  qa:
    name: QA
    needs: [setup]
    uses: ./.github/workflows/agent-qa.yml
    with:
      pr_number: ${{ needs.setup.outputs.pr_number }}
      head_ref: ${{ needs.setup.outputs.head_ref }}
    secrets: inherit

  # ──────────────────────────────────────────────
  # Notification: all reviews complete
  # ──────────────────────────────────────────────
  notify-ready:
    name: Ready for Review
    needs: [setup, strategic-review, custodiet, qa]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Post pipeline summary
        run: |
          PR_NUM="${{ needs.setup.outputs.pr_number }}"

          gh pr comment "$PR_NUM" --repo "${{ github.repository }}" --body "$(cat <<'SUMMARY'
          ## Pipeline Complete

          All automated review stages have passed:

          | Stage | Status |
          |-------|--------|
          | Lint | Passed |
          | Gatekeeper | Approved |
          | Type check | Passed |
          | Unit tests | Passed |
          | Strategic review | Passed |
          | Custodiet | Passed |
          | QA | Passed |

          **Ready for human review.**
          SUMMARY
          )"
