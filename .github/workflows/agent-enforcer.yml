# Agent: Enforcer
# Universal standards enforcement — axiom compliance reviewer.
# Prompt: .github/agents/enforcer.md
# Source: academicOps enforcer agent (aops-core/agents/enforcer.md)

name: Agent – Enforcer

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_ref:
        required: true
        type: string

jobs:
  enforcer:
    name: Enforcer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_ref }}

      - name: Read enforcer instructions
        id: enforcer-prompt
        run: |
          PROMPT=$(cat .github/agents/enforcer.md)
          {
            echo "prompt<<ENFORCER_EOF"
            echo "$PROMPT"
            echo "ENFORCER_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run Enforcer Agent
        uses: anthropics/claude-code-action@v1
        with:
          allowed_bots: "claude[bot]"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            ${{ steps.enforcer-prompt.outputs.prompt }}

            ---

            Your task: Review PR #${{ inputs.pr_number }} in repository ${{ github.repository }} against the axioms above.

            1. Read `.agent/CORE.md` from the repo root for local project context.
            2. Run `gh pr view ${{ inputs.pr_number }}` to understand the PR.
            3. Run `gh pr diff ${{ inputs.pr_number }}` to see the changes.
            4. Check each change against the axioms.
            5. Post a PR review using `gh pr review` — APPROVE if no violations, REQUEST_CHANGES if violations found. Include a brief summary of your findings.

          claude_args: '--allowed-tools "Bash(gh:*),Read"'
