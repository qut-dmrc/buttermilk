name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
    
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/prosocial-443205/locations/global/workloadIdentityPools/devops/providers/github-actions'
          service_account: 'services@prosocial-443205.iam.gserviceaccount.com'
      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
          # Optional: Specify the tools Claude can use
          # since this is running in a GitHub Actions virtual machine (which is isolated and ephemeral), we can safely give Claude Code broader bash permissions.
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep,LS"

          # Optional: Specify model (defaults to Claude Sonnet 4, uncomment for Claude Opus 4)
          model: "claude-opus-4-20250514"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          assignee_trigger: "claude"

          # Optional: Add custom instructions for Claude to customize its behavior for your project
          custom_instructions: |
            CRITICAL: Follow instructions in @docs/bots/INSTRUCTIONS.md
            
            Use the MCP tools in .mcp/tools/ for:
            - Workflow validation: .mcp/tools/buttermilk-workflow-check.sh
            - Log viewing: .mcp/tools/buttermilk-logs.sh
            - Server management: .mcp/tools/buttermilk-server.sh
            - Flow testing: .mcp/tools/buttermilk-test-flow.sh
            - Config validation: .mcp/tools/buttermilk-config-validate.sh
            - GitHub issues: .mcp/tools/buttermilk-github-issue.sh
          # Optional: Custom environment variables for Claude
          # claude_env: |
          #   NODE_ENV: test
