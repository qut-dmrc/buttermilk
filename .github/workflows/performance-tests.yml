name: Performance Tests
on:
  pull_request:
    types: [opened, reopened] # Only on PR open/reopen, not every commit
    branches: [main]  # Only run on PRs to main (not dev)
    paths:
      - "buttermilk/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
  push:
    branches: [main]  # Only run on pushes to main (not dev)
  workflow_dispatch: # Allow manual triggering for any branch
jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Prevent loops from bot-triggered workflows
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for baseline comparison
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          # Skip ML extras (heavy dependencies like torch, transformers)
          # Only install core + dev dependencies for performance tests
          uv sync --no-install-project --extra azure --extra aws --extra research
          uv sync --dev
      - name: Download baseline benchmarks
        id: download-baseline
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .benchmarks/baseline
          key: performance-baseline-${{ github.base_ref || 'main' }}
          restore-keys: |
            performance-baseline-
      - name: Run performance tests
        id: run-tests
        run: |
          python scripts/performance/monitor_performance.py --compare --threshold 10
        continue-on-error: true
      - name: Save current results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache@v4
        with:
          path: .benchmarks/baseline
          key: performance-baseline-${{ github.ref_name }}-${{ github.sha }}
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            .benchmarks/current/*.json
            .benchmarks/reports/*
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.run-tests.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read comparison results (you'd generate this in monitor_performance.py)
            let comment = '## ⚠️ Performance Test Results\n\n';
            comment += 'Performance regression detected. See artifacts for details.\n\n';
            comment += '[View detailed results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      - name: Fail if regressions detected
        if: steps.run-tests.outcome != 'success'
        run: exit 1
